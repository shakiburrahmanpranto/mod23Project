<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo mfs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="flex justify-center">
      <div class="mockup-phone bg-yellow-100">
        <div class="mockup-phone-camera"></div>
        <div class="mockup-phone-display text-white grid place-content-center">
          <!--Account balance form-->
          <div class="stats shadow">
            <div class="stat bg-white">
              <div class="stat-title text-black text-2xl font-mono">
                Account Balance
              </div>
              <div id="account_balance" class="stat-value text-black">89,400</div>
            </div>
          </div>
          <div class="divider"></div>
          <!--Add money form start-->
          <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="fieldset-label">Add Money Amount</label>
                <input id="input_add_money" type="email" class="input text-black" placeholder="Enter your amount" />
                <label class="fieldset-label">Pin</label>
                <input id="pin" type="password" class="input text-black" placeholder="Enter your pin" />
             
                <button id="btn_addMoney" class="btn btn-neutral mt-4">Add Money</button>
              </fieldset>
            </div>
          <!--Add money form end-->
        </div>
      </div>
    </main>
  <script src="js/addmoney.js"></script>  
  </body>
</html>
